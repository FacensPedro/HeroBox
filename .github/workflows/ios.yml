name: iOS
on: [push, pull_request, workflow_dispatch]
jobs:
  media:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project HeroBox.xcodeproj -scheme HeroBox -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
