name: iOS
on: [push, pull_request, workflow_dispatch]
jobs:
  media:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 -m unittest discover -s Tests/Packaging -p 'test_*.py'
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project HeroBox.xcodeproj -scheme HeroBox -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify app version
        run: |
          plist=build/DerivedData/Build/Products/Debug-iphoneos/HeroBox.app/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "0.1.1"
  original-xbox:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the original Xbox player
        run: bash scripts/build-original-xbox.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HeroBox-0.1.1-original-Xbox
          path: build/HeroBox-0.1.1.ipa
          if-no-files-found: error

  xbox-360:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Package the pinned Xbox 360 emulation core
        run: bash scripts/build-xbox-360.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HeroBox-0.1.1-Xbox360
          path: build/HeroBox-0.1.1-Xbox360.ipa
          if-no-files-found: error
