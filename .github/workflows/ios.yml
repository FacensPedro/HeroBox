name: iOS
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift media tests
        run: swift test
      - name: Python packaging regression tests
        run: python3 -m unittest discover -s Tests/Packaging -p 'test_*.py'
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build SwiftUI inspector
        run: xcodebuild -project HeroBox.xcodeproj -scheme HeroBox -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify 0.1.0 version and build number
        run: |
          plist=build/DerivedData/Build/Products/Debug-iphoneos/HeroBox.app/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "0.1.0"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "1"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "com.herobox.app"

  original_xbox:
    name: Build and release HeroBox 0.1.0 IPA
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    needs: validation
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build original Xbox native runtime and IPA
        run: bash scripts/build-original-xbox.sh
      - name: Verify original Xbox release package
        shell: bash
        run: |
          set -euo pipefail
          archive="build/HeroBox-0.1.0.ipa"
          test -s "$archive"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          ditto -x -k "$archive" "$work"
          app="$work/Payload/HeroBox.app"
          python3 scripts/verify_original_xbox.py "$app"
          codesign --verify --deep --strict "$app"
          executable=$(plutil -extract CFBundleExecutable raw "$app/Info.plist")
          xcrun lipo "$app/$executable" -verify_arch arm64
          xcrun lipo "$app/Frameworks/libxemu-ios-core.dylib" -verify_arch arm64
      # Do not use actions/upload-artifact: GitHub Actions wraps downloads in ZIP.
      # Publish the .ipa itself as a GitHub Release asset instead.
      - name: Publish direct IPA asset in GitHub Release v0.1.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ipa="build/HeroBox-0.1.0.ipa"
          test -s "$ipa"
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A bundle identifier change requires replacing the existing IPA,
            # rather than retaining an archive with the previous identifier.
            gh release upload v0.1.0 "$ipa" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v0.1.0 --notes-file docs/RELEASE_NOTES_0.1.0.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.0 "$ipa" \
              --title "HeroBox 0.1.0" \
              --notes-file docs/RELEASE_NOTES_0.1.0.md \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "### Download the IPA directly (no extra ZIP wrapper)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.0/HeroBox-0.1.0.ipa" >> "$GITHUB_STEP_SUMMARY"

  unified:
    name: Unified three-console native integration readiness
    runs-on: macos-15
    needs: validation
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check native adapter availability
        id: readiness
        shell: bash
        run: |
          if python3 scripts/check_unified_sources.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Experimental unified IPA is blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Xbox 360 and Xbox One native adapters are not yet integrated." >> "$GITHUB_STEP_SUMMARY"
            echo "HeroBox 0.1.0 packages the original Xbox native engine only." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and verify unified native candidate
        if: steps.readiness.outputs.ready == 'true'
        run: bash scripts/build-unified.sh
