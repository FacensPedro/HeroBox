name: iOS
on: [push, pull_request, workflow_dispatch]
jobs:
  validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift media tests
        run: swift test
      - name: Python runtime packaging tests
        run: python3 -m unittest discover -s Tests/Packaging -p 'test_*.py'
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build SwiftUI host
        run: xcodebuild -project HeroBox.xcodeproj -scheme HeroBox -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Verify 0.1.1 version
        run: |
          plist=build/DerivedData/Build/Products/Debug-iphoneos/HeroBox.app/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "0.1.1"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "2"
  unified:
    name: Build one IPA with all three real native cores
    runs-on: macos-15
    needs: validation
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native integration and release gate
        run: bash scripts/build-unified.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HeroBox-0.1.1
          path: build/HeroBox-0.1.1.ipa
          if-no-files-found: error
