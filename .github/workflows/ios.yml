name: iOS
on: [push, pull_request, workflow_dispatch]
jobs:
  media:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project HeroBox.xcodeproj -scheme HeroBox -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
  xbox-one-upstream:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Leviidev/Utsuro
          submodules: recursive
      - run: brew install xcodegen ninja cmake
      - run: bash scripts/package_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Utsuro-upstream
          path: ~/Desktop/Utsuro.ipa
          if-no-files-found: error
